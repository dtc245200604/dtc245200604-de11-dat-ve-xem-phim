log_format structured escape=json '{"timestamp":"$time_iso8601","service":"nginx","method":"$request_method","path":"$uri","status":$status,"request_time":$request_time,"request_id":"$request_id"}';
upstream cinema_app { server app:3000; keepalive 16; }
server {
    listen 8080;
    server_name localhost;
    include /etc/nginx/conf.d/security.inc;
    location ~ ^/(metrics|stub_status)(/|$) { return 404; }
    location / { include /etc/nginx/conf.d/proxy.inc; proxy_set_header X-Forwarded-Proto $scheme; }
}
# Listener chỉ dùng trong mạng Docker cho Cloudflare Tunnel.
server {
    listen 8083;
    server_name rapmay.nvdo.io.vn;
    include /etc/nginx/conf.d/security.inc;
    location ~ ^/(metrics|stub_status|healthz|readyz)(/|$) { return 404; }
    location / { include /etc/nginx/conf.d/proxy.inc; proxy_set_header X-Forwarded-Proto https; }
}
server {
    listen 8082;
    server_name _;
    access_log off;
    location = /stub_status { stub_status; }
    location / { return 404; }
}
