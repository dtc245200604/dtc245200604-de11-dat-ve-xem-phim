server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: app
    static_configs:
      - targets: [localhost]
        labels:
          project: de11datvewsl
          service: app
          __path__: /var/log/app/app.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            event: event
            time: time
      - timestamp:
          source: time
          format: RFC3339Nano
      - labels:
          level:
          event:

  - job_name: nginx-access
    static_configs:
      - targets: [localhost]
        labels:
          project: de11datvewsl
          service: nginx
          stream: access
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
      - timestamp:
          source: timestamp
          format: RFC3339

  - job_name: nginx-error
    static_configs:
      - targets: [localhost]
        labels:
          project: de11datvewsl
          service: nginx
          stream: error
          __path__: /var/log/nginx/error.log

  - job_name: mysql
    static_configs:
      - targets: [localhost]
        labels:
          project: de11datvewsl
          service: mysql
          __path__: /var/log/mysql/error.log
